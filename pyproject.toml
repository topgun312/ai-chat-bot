[project]
name = "ai-history-chat-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0.0",
    "black>=26.10.1",
    "flake8>=7.4.1",
    "httpx[http2]>=0.28.1",
    "isort>=9.0.2",
    "openai>=3.3.1",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "rich>=15.0.0",
    "tiktoken>=0.14.0",
]


[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

